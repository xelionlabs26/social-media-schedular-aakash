# Run everything locally with Docker:  docker compose up --build
# Then open http://localhost:3000 (fill in .env first, see README).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler']
      interval: 5s
      retries: 10

  worker:
    build: .
    command: ['pnpm', 'start:worker']
    env_file: .env
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
    volumes:
      - appdata:/app/.data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: ['pnpm', 'start:web']
    env_file: .env
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@db:5432/scheduler
    volumes:
      - appdata:/app/.data
    ports:
      - '3000:3000'
    depends_on:
      - worker

volumes:
  pgdata:
  appdata:
